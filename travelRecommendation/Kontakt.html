<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Travel Bloom -  Reiseempfehlungen</title>

        <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <link rel="stylesheet" href="css/style.css">

        <style>
            body {
                /* Bild aus dem gleichen Ordner laden */
                background-image: url('Flugzeug.jpg');

                /* Bild an die Fenstergröße anpassen */
                background-size: 50% auto;          /* skaliert, damit das Bild den gesamten Viewport füllt */
                background-repeat: no-repeat;   /* kein Kacheln */
                background-position: center;    /* zentriert */
                background-attachment: fixed;   /* Bild bleibt beim Scrollen fixiert (optional) */
                margin: 0;                       /* ggf. gewünschten Abstand entfernen */
            }
        </style>
    </head>

    <body>
        <nav>

            <div class="Pages">
                <a href="travel_recommendation.html">Startseite</a>
                <a href="Ueberuns.html">Über uns</a>
                <a href="Kontakt.html">Kontaktieren Sie uns</a> 
            </div>

        </nav>

        <header class="website-title">
            <h1>TravelBloom - Reiseempfehlungen</h1>
        </header>


        <section class="Kontaktieren Sie uns">
            <div class="overlay"></div>
    
            <div class="inhalt">
                <h1>So erreichen Sie uns:</h1>
    
                <p class="intro">
                    Nutzen Sie unser nachfolgendes Kontaktformular oder schreiben Sie uns per Mail an mail@mail.de oder per Telefon unter 00000000 oder Sie besuchen uns an der Musterstraße 12 in Musterstadt.
                </p>
            </div>

            <form class=""kontakt-formular">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">E-Mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="text">Ihre Nachricht an uns:</label>
                <textarea type="text" id="text" name="text" required>
                 
                <button type="absenden">Nachricht senden</button>

            </form>

            
        </section>
    </body>    

</html>
